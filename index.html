/* v63: source-independent tracks. Every track carries src (provider id), pid (that provider's own track id) and ext
   (provider-specific extras, e.g. a stream/web URL). Local tracks keep their original id ("name|size") untouched; for them
   pid===id and ext is empty, so all existing saved data, playlists and statistics keep working. Provider adapters are registered below for active sources. */
const SRC={LOCAL:'local',AUDIUS:'audius',JAMENDO:'jamendo',SPOTIFY:'spotify',ITUNES:'itunes'};
const SRC_INFO={
 local:{label:'This device',audio:'blob',playable:true},
 audius:{label:'Audius',audio:'remote',playable:true},
 jamendo:{label:'Jamendo',audio:'remote',playable:true},
 spotify:{label:'Spotify',audio:'none',playable:false}/* metadata reference only; Spotify audio is never played */,
 itunes:{label:'Apple/iTunes',audio:'remote',playable:true}

const srcOf=t=>t&&SRC_INFO[t.src]?t.src:SRC.LOCAL;
const isLocal=t=>srcOf(t)===SRC.LOCAL;
const isRemote=t=>SRC_INFO[srcOf(t)].audio==='remote';
const isPlayable=t=>SRC_INFO[srcOf(t)].playable;
const trackKey=t=>srcOf(t)+':'+(t&&t.pid!=null&&t.pid!==''?t.pid:t&&t.id);

function normalizeTrack(t){
 if(!t||typeof t!=='object')return t;
 if(!SRC_INFO[t.src])t.src=SRC.LOCAL;
 if(t.pid==null||t.pid==='')t.pid=t.id;
 if(!t.ext||typeof t.ext!=='object'||Array.isArray(t.ext))t.ext={};
 return t;
}

   refs ({trackId: {src,pid,title,artist,album,dur}}), a small snapshot per entry so an entry can still be shown, matched or retried when its

/* v66 BEGIN: unified search architecture (no UI, no network of its own). One query can be answered by the local library and, later, by online
   providers; every result comes back in the same shape, tagged with its source, flagged when it duplicates something else, and each source
   reports its own status so one failing provider never hides the others. NO provider endpoint exists here: remote adapters are registered
   by later work with registerSearchProvider(). Until then only the library answers and remote sources report "unavailable". */
const SEARCH_CFG={

/* v75 BEGIN: Downloads UI + integration. Builds on the v74 engine (XZDL) and keeps its rules: downloads only start from an explicit tap, the provider is
   re-checked for permission every time, bytes go to persistent storage only. This block adds:
   - a Downloads view (nav, Library chip, Settings entry) with live progress, pause / resume / retry / cancel, and delete with a warning
   - offline indicators (rows, queue, song info, player, online results) and Download buttons (online results, track menu, player, multi-select)
   - one library entry per song: when a download finishes, the online entry it came from is merged into the downloaded song (favourite, play counts, history,
     playlists and the queue all move over), re-downloading a song whose file went missing keeps its favourite / playlists / stats, and importing a file

<!-- v80: public Audius playlist discovery, playlist detail, and play-through-unified-player -->
<script>
(()=>{
 const RPL={query:'',results:[],busy:false,error:'',detail:null,tracks:[],busyTracks:false,token:0,timer:0};window.__RPL=RPL;
 const api=AUDIUS_CFG.base;
 const plArt=x=>{const a=x&&x.artwork&&typeof x.artwork==='object'?x.artwork:{};return a['480x480']||a['1000x1000']||a['150x150']||''};
 const esc=H;
 function rplNormTrack(x,i){const raw=audiusToRaw(x,i);if(!raw)return null;const r=makeResult(raw,SRC.AUDIUS,false);if(!r)return null;r.score=scoreResult(r,RPL.query);return r}
 function rplRender(){const el=$('#ll');if(!el||lib.tab!=='playlists')return;
  if(RPL.detail){const d=RPL.detail,ts=RPL.tracks;el.innerHTML=`<div class="card" style="display:flex;gap:12px;align-items:center"><button class="ib" data-act="rplBack" aria-label="Back to playlist search">←</button>${d.art?`<img src="${esc(d.art)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" style="width:92px;height:92px;object-fit:cover;border-radius:14px">`:`<div class="art" style="width:92px;height:92px;flex:none">♫</div>`}<div class="rm"><b>${esc(d.name)}</b><small>${esc(d.creator||'Audius playlist')} · ${d.count||ts.length} tracks</small></div></div><div class="bar"><button class="btn" data-act="rplPlayAll" ${ts.length?'':'disabled'}>Play playlist</button><a class="chip" href="${esc(d.url||'https://audius.co')}" target="_blank" rel="noopener noreferrer">Open source ↗</a></div>${RPL.busyTracks?'<p class="mu">Loading playlist tracks…</p>':RPL.error?`<p class="mu">${esc(RPL.error)}</p><button class="btn g" data-act="rplRetryTracks">Retry</button>`:ts.length?ts.map((r,i)=>`<div class="row" data-rplkey="${esc(r.key)}"><div class="art" style="${tint(resultToTrack(r))}">${r.art?`<img src="${esc(r.art)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:cover;border-radius:12px">`:'♫'}</div><div class="rm" data-act="rplPlay" data-i="${i}" role="button" tabindex="0"><b>${esc(r.title)}</b><small>${esc([r.artist,r.dur?fT(r.dur):''].filter(Boolean).join(' · '))}</small></div><span class="ol-badge">Audius</span></div>`).join(''):'<p class="mu">This playlist has no playable tracks.</p>'}`;return}
  const local=plList();const q=normalizeQuery(lib.q);const onlineHead=`<section style="margin-top:18px"><h3 class="sec">Public playlists</h3><small class="mu">Search public playlists on Audius. Open a playlist to view tracks and play them through X.ZON.</small></section>`;
  const cards=RPL.results.map(x=>`<div class="row rpl-card" role="button" tabindex="0" data-act="rplOpen" data-id="${esc(x.id)}"><div class="art playlist-art">${x.art?`<img src="${esc(x.art)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:cover;border-radius:12px">`:'♫'}</div><div class="rm"><b>${esc(x.name)}</b><small>${esc(x.creator||'Audius')} · ${x.count||'Track count unavailable'}</small></div><span class="ol-badge">Audius</span></div>`).join('');
  el.innerHTML=local+onlineHead+(RPL.busy?'<p class="mu" role="status">Searching public playlists…</p>':RPL.error?`<p class="mu">${esc(RPL.error)}</p><button class="btn g" data-act="rplRetry">Try again</button>`:q.length>=2?(cards||'<p class="mu">No public playlists found.</p>'):'<p class="mu">Type at least 2 characters to search public playlists.</p>');
 }
 async function rplSearch(q){const query=normalizeQuery(q);RPL.query=query;const tok=++RPL.token;RPL.results=[];RPL.error='';if(query.length<2){RPL.busy=false;rplRender();return}RPL.busy=true;rplRender();try{const u=new URL(api+'/playlists/search');u.searchParams.set('query',query);u.searchParams.set('limit','20');u.searchParams.set('app_name',AUDIUS_CFG.appName);const c=new AbortController(),timer=setTimeout(()=>c.abort(),AUDIUS_CFG.timeoutMs);let res;try{res=await fetch(u.toString(),{signal:c.signal,headers:{Accept:'application/json'}})}finally{clearTimeout(timer)}if(!res.ok)throw new Error(res.status===429?'Audius playlist search is busy. Try again shortly.':'Audius playlist search returned '+res.status);const j=await res.json();if(!j||!Array.isArray(j.data))throw new Error('Audius returned an unexpected playlist response');RPL.results=j.data.filter(x=>x&&x.id!=null&&x.playlist_name).map(x=>({id:String(x.id),name:normText(x.playlist_name),creator:normText(x.user&&x.user.name)||normText(x.user&&x.user.handle),count:Number(x.track_count)||Number(x.playlist_contents&&x.playlist_contents.length)||0,art:httpsOnly(plArt(x)),url:httpsOnly(x.permalink),pop:(Number(x.favorite_count)||0)+(Number(x.repost_count)||0),album:x.is_album===true})).filter(x=>x.name&&!x.album&&x.count>=3).sort((a,b)=>b.pop-a.pop).slice(0,20)}catch(e){RPL.error=e&&e.name==='AbortError'?'Playlist search timed out. Try again.':String(e&&e.message||'Could not search public playlists')}finally{if(tok===RPL.token){RPL.busy=false;rplRender()}}}
 async function rplLoadTracks(){const d=RPL.detail;if(!d)return;RPL.busyTracks=true;RPL.error='';rplRender();try{const u=new URL(api+'/playlists/'+encodeURIComponent(d.id)+'/tracks');u.searchParams.set('limit','100');u.searchParams.set('app_name',AUDIUS_CFG.appName);const c=new AbortController(),timer=setTimeout(()=>c.abort(),AUDIUS_CFG.timeoutMs);let res;try{res=await fetch(u.toString(),{signal:c.signal,headers:{Accept:'application/json'}})}finally{clearTimeout(timer)}if(!res.ok)throw new Error(res.status===429?'Audius is busy. Try again shortly.':'Could not load playlist tracks ('+res.status+')');const j=await res.json();const arr=Array.isArray(j.data)?j.data:[];RPL.tracks=arr.map(rplNormTrack).filter(Boolean);if(!RPL.tracks.length)RPL.error='No playable tracks were returned for this playlist.'}catch(e){RPL.error=e&&e.name==='AbortError'?'Playlist loading timed out.':String(e&&e.message||'Could not load playlist')}finally{RPL.busyTracks=false;rplRender()}}
 ACT.rplOpen=async el=>{const x=RPL.results.find(p=>p.id===el.dataset.id);if(!x)return;RPL.detail=x;RPL.tracks=[];RPL.error='';lib.q='';R();await rplLoadTracks()};
 ACT.rplBack=()=>{RPL.detail=null;RPL.tracks=[];RPL.error='';R()};
 ACT.rplRetry=()=>rplSearch(lib.q);
 ACT.rplRetryTracks=()=>rplLoadTracks();
 ACT.rplPlay=el=>{const r=RPL.tracks[Number(el.dataset.i)];if(!r)return;let t=resultToTrack(r);delete t.ext.rank;t.ext.temp=1;T.set(t.id,t);if(t.ext.art)ART.set(t.id,t.ext.art);playQ([t.id],0)};
 ACT.rplPlayAll=()=>{const ids=[];for(const r of RPL.tracks){let t=resultToTrack(r);delete t.ext.rank;t.ext.temp=1;T.set(t.id,t);if(t.ext.art)ART.set(t.id,t.ext.art);ids.push(t.id)}if(ids.length)playQ(ids,0);else toast('No playable tracks in this playlist')};
 const oldLibList=libList;
 libList=function(){oldLibList();if(lib.tab==='playlists')rplRender()};
 document.addEventListener('input',e=>{if(e.target&&e.target.id==='q'&&lib.tab==='playlists'){clearTimeout(RPL.timer);RPL.timer=setTimeout(()=>rplSearch(lib.q),420)}},true);
 document.addEventListener('click',e=>{const tab=e.target.closest('[data-act="tab"][data-t="playlists"]');if(tab){setTimeout(()=>{if(view==='library'&&lib.tab==='playlists')rplSearch(lib.q)},0)}});
 if(view==='library'&&lib.tab==='playlists')rplSearch(lib.q);
})();

<!-- X.ZON v95: live Audius discovery feed (non-blocking, cache-backed) -->
<script>
(()=>{
 'use strict';
 window.__XZ_HOME_SRC=window.__XZ_HOME_SRC||{};const XZAD={tracks:[],state:'idle',error:'',updated:0,lastAttempt:0,busy:false,ttl:20*60*1000,errorTtl:2*60*1000,controller:null};
 const safeText=v=>typeof H==='function'?H(String(v==null?'':v)):String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function xzArt(t){const u=t&&t.ext&&t.ext.art;return u&&/^https:\/\//i.test(u)?`<img src="${safeText(u)}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;border-radius:12px">`:'♫'}
 function xzRender(){const el=document.getElementById('xz-audius-discovery');if(!el)return;
  if(XZAD.busy&&!XZAD.tracks.length){el.innerHTML='<p class="mu" role="status">Loading live tracks from Audius…</p>';return}
  if(XZAD.error&&!XZAD.tracks.length){el.innerHTML=`<p class="mu">${safeText(XZAD.error)}</p><button class="btn g" data-act="xzAudiusRetry">Retry</button>`;return}
  if(!XZAD.tracks.length){el.innerHTML='<p class="mu">No trending tracks available right now.</p>';return}
  el.innerHTML=`<div class="bar" style="justify-content:space-between;margin:4px 0 10px"><small class="mu">Live catalog · Audius</small><button class="btn g" data-act="xzAudiusPlayAll">Play all</button></div><div class="hs">${XZAD.tracks.map((t,i)=>`<div class="tile" role="button" tabindex="0" data-act="xzAudiusPlay" data-i="${i}" aria-label="Play ${safeText(t.title)}"><div class="art" style="${typeof tint==='function'?tint(t):''}">${xzArt(t)}</div><b>${safeText(t.title)}</b><small>${safeText(t.artist||'Unknown artist')}</small><small class="mu">Audius · Trending</small></div>`).join('')}</div>`;
 }
 async function xzLoad(force=false){if(XZAD.busy)return;if(!force&&XZAD.tracks.length&&Date.now()-XZAD.updated<XZAD.ttl){xzRender();return}if(!force&&XZAD.error&&Date.now()-XZAD.lastAttempt<XZAD.errorTtl){xzRender();return}
  XZAD.busy=true;XZAD.error='';XZAD.lastAttempt=Date.now();XZAD.controller=new AbortController();xzRender();let timeoutId=0;
  try{const u=new URL(AUDIUS_CFG.base+'/tracks/trending');u.searchParams.set('time','week');u.searchParams.set('limit','30');u.searchParams.set('app_name',AUDIUS_CFG.appName);
   const response=await Promise.race([fetch(u.toString(),{signal:XZAD.controller.signal,headers:{Accept:'application/json'}}),new Promise((_,reject)=>{timeoutId=setTimeout(()=>{if(XZAD.controller)XZAD.controller.abort();reject(new Error('Audius discovery timed out'))},9000)})]);
   if(!response.ok)throw new Error(response.status===429?'Audius is busy. Try again later.':'Audius discovery returned '+response.status);
   const j=await response.json();if(!j||!Array.isArray(j.data))throw new Error('Audius discovery response was malformed');
   const list=j.data.map((x,i)=>{const raw=audiusToRaw(x,i);if(!raw)return null;const r=makeResult(raw,SRC.AUDIUS,false);return r?resultToTrack(r):null}).filter(t=>t&&t.id&&t.title&&t.ext);
   const seen=new Set();XZAD.tracks=list.filter(t=>{if(seen.has(t.id))return false;seen.add(t.id);t.ext.temp=1;T.set(t.id,t);if(t.ext.art)ART.set(t.id,t.ext.art);return true}).slice(0,18);XZAD.updated=Date.now();XZAD.state='ok';try{window.__XZON_TREND_IDS=XZAD.tracks.map(t=>t.id)}catch(e){}
  }catch(e){XZAD.error=e&&e.message?e.message:'Audius discovery unavailable';XZAD.state='error'}finally{clearTimeout(timeoutId);XZAD.busy=false;XZAD.controller=null;if(view==='home'){xzRender();try{xzWarmHome()}catch(e){}}}
 }
 function playAt(i){const t=XZAD.tracks[Number(i)];if(!t)return;const ids=XZAD.tracks.map(x=>{T.set(x.id,x);return x.id});playQ(ids,Math.max(0,ids.indexOf(t.id)))}
 function playAll(){const a=XZAD.tracks;if(!a.length)return;const ids=a.map(t=>{T.set(t.id,t);return t.id});playQ(ids,0)}
 window.__XZ_HOME_SRC.trend=()=>XZAD.tracks;
 if(typeof vHome==='function'){const oldHome=vHome;vHome=function(){return oldHome()+'<h2 class="home-section-title">Trending this week</h2><div id="xz-audius-discovery" aria-live="polite"><p class="mu">Loading live tracks from Audius…</p></div>'}}
 if(typeof ACT==='object'){
  ACT.xzAudiusPlay=e=>playAt(e.dataset.i);
  ACT.xzAudiusPlayAll=()=>playAll();
  ACT.xzAudiusRetry=()=>xzLoad(true);
 }
 if(typeof R==='function'){const oldR=R;R=function(a){oldR(a);if(view==='home'){xzRender();if(!XZAD.tracks.length&&!XZAD.busy)xzLoad(false);else try{xzWarmHome()}catch(e){}}}}
 if(view==='home'){R(true)}
})();
</script>

.st-col.today .st-bar{box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 55%,transparent)}
.st-col.zero .st-bar{background:color-mix(in srgb,var(--mu) 22%,transparent);min-height:3px}
.st-col.future .st-bar{opacity:.35}
.st-col:hover .st-bar,.st-col:focus-visible .st-bar{background:var(--ac);filter:brightness(1.08)}
.st-axis{display:flex;gap:clamp(3px,.7vw,8px);margin-top:8px}.st-axis span{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--mu);white-space:nowrap;overflow:visible}
.st-read{font-size:13px;font-weight:600;color:var(--tx);text-align:right;min-height:1.3em}
.st-ins{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.st-ins span{display:inline-flex;gap:6px;align-items:baseline;padding:7px 13px;border-radius:999px;background:color-mix(in srgb,var(--ln) 80%,transparent);font-size:12.5px;color:var(--mu)}.st-ins b{color:var(--tx);font-weight:650}
/* ranked rows with covers */
.st-list{display:flex;flex-direction:column;gap:4px;margin:-6px -8px}
.st-row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:20px;cursor:pointer;transition:background .2s,transform .15s}
.st-row:hover{background:color-mix(in srgb,var(--ln) 70%,transparent)}.st-row:active{transform:scale(.985)}
.st-rank{width:20px;flex:none;text-align:center;font-size:13px;font-weight:700;color:var(--mu);font-variant-numeric:tabular-nums}
.st-row:first-child .st-rank{color:var(--ac)}
.st-art{flex:none;width:52px;height:52px;border-radius:min(var(--r-bar,34px),32%);display:grid;place-items:center;font-size:20px;color:#fff;background-size:cover!important;background-position:center!important;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.st-mid{flex:1;min-width:0}.st-mid b{display:block;font-size:14.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.st-mid small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-meter{height:5px;border-radius:999px;margin-top:7px;background:color-mix(in srgb,var(--ln) 90%,transparent);overflow:hidden}
.st-meter i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 70%,transparent),var(--ac));transform-origin:left;animation:stGrowX .8s var(--ease-out) both;animation-delay:calc(var(--bi,0)*70ms + 200ms)}
.st-val{flex:none;text-align:right;font-size:13px;font-weight:650}.st-val small{display:block;font-weight:500}
/* shelves with covers */
.st-sub{display:block;margin:2px 0 12px;color:var(--mu);font-size:13px}
.st-tile .art{position:relative}
.st-tile .st-badge{position:absolute;left:10px;top:10px;min-width:26px;height:26px;padding:0 8px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:750;color:#fff;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.st-tile:first-child .st-badge{background:var(--ac)}
/* donut */
.st-donut{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.st-donut svg{width:176px;height:176px;flex:none;transform:rotate(-90deg)}
.st-donut circle{fill:none;stroke-width:6.2}
.st-ring{stroke:color-mix(in srgb,var(--ln) 90%,transparent)}
.st-slice{animation:stDraw 1s var(--ease-out) both;animation-delay:calc(var(--bi,0)*120ms + 150ms)}
.st-dwrap{position:relative;flex:none}.st-dcenter{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:0 34px}.st-dcenter b{font-size:15px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.st-dcenter small{font-size:12px}
.st-legend{flex:1;min-width:190px;display:flex;flex-direction:column;gap:10px}
.st-legend div{display:flex;align-items:center;gap:10px;font-size:14px}.st-legend i{width:11px;height:11px;border-radius:50%;flex:none}.st-legend span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.st-legend em{font-style:normal;font-weight:650;color:var(--mu);font-variant-numeric:tabular-nums}
/* two column cards */
.st-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;margin:12px 0}.st-two .st-card{margin:0}
.st-mini .st-row{padding:6px 8px}.st-mini .st-art{width:44px;height:44px}
.st-none{margin:6px 0;color:var(--mu);font-size:14px}
@media(prefers-reduced-motion:reduce){.st-page>*,html body #main .v>*,.st-bar,.st-meter i,.st-slice{animation:none!important}}
html.lite .st-page>*,html.lite body #main .v>*,html.lite .st-bar,html.lite .st-meter i,html.lite .st-slice{animation:none!important}
</style>
<script id="xz-v118-stats-js">
(()=>{try{
const DAY=864e5,PALETTE=['#7c4dff','#ff7a45','#20bfa9','#e6b64b','#e75b87','#4888ff'];
const dayStart=ts=>{const d=new Date(ts);return +new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const wd=(ts,o)=>new Date(ts).toLocaleDateString(undefined,o);
const art=(t,cls='st-art')=>`<div class="${cls}" style="${tint(t)}">${lt(t)}</div>`;
const UNK=/^(unknown( artist| album| genre)?|)$/i;
function buildBuckets(a,b,bd,first){
 const now=Date.now(),td=dayStart(now),tk=dkey(now),mk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
 const ms={},ys={};for(const k in bd){ms[k.slice(0,7)]=(ms[k.slice(0,7)]||0)+bd[k];ys[k.slice(0,4)]=(ys[k.slice(0,4)]||0)+bd[k]}
 const days=(start,n,lab,sub)=>{const o=[];for(let i=0;i<n;i++){const d=new Date(start);d.setDate(d.getDate()+i);const k=dkey(d);o.push({label:lab(d,i,n),tip:wd(d,{weekday:'short',day:'numeric',month:'short'}),val:bd[k]||0,future:+d>now,today:k===tk})}return{sub,items:o}};
 const months=(from,to,lab,sub)=>{const o=[];for(let d=new Date(from.getFullYear(),from.getMonth(),1);+d<=+to;d.setMonth(d.getMonth()+1)){const k=mk(d);o.push({label:lab(d,o.length),tip:wd(d,{month:'long',year:'numeric'}),val:ms[k]||0,future:+d>now,today:k===mk(new Date(now))})}return{sub,items:o}};
 const years=(from,to)=>{const o=[];for(let y=from.getFullYear();y<=to.getFullYear();y++)o.push({label:String(y),tip:String(y),val:ys[y]||0,future:false,today:y===new Date(now).getFullYear()});return{sub:'Per year',items:o}};
 const lo=new Date(Math.max(a,first===Infinity?now:first)),hi=new Date(Math.min(b,now));
 if(period==='today')return days(td-6*DAY,7,d=>wd(d,{weekday:'short'}).slice(0,3),'Today and the six days before');
 if(period==='week')return days(a,7,d=>wd(d,{weekday:'short'}).slice(0,3),'This week, day by day');
 if(period==='month'){const d0=new Date(a),n=new Date(d0.getFullYear(),d0.getMonth()+1,0).getDate();return days(a,n,(d,i,n)=>(i%5===0||i===n-1)?String(d.getDate()):'','This month, day by day')}
 if(period==='year')return months(new Date(a),new Date(new Date(a).getFullYear(),11,1),d=>wd(d,{month:'narrow'}),'This year, month by month');
 const spanD=Math.round((dayStart(hi)-dayStart(lo))/DAY)+1;
 if(period==='custom'&&spanD<=45)return days(dayStart(lo),spanD,(d,i,n)=>(n<=14||i%Math.ceil(n/8)===0)?String(d.getDate()):'','Day by day');
 const mCount=(hi.getFullYear()-lo.getFullYear())*12+hi.getMonth()-lo.getMonth()+1;
 if(mCount>18)return years(lo,hi);
 return months(lo,hi,(d,i)=>mCount<=12?wd(d,{month:'narrow'}):(i%3===0?wd(d,{month:'short'}):''),'Month by month');
}
vStats=function(){
 const [a,b]=range(),now=Date.now();
 let tot=0,songs=0,first=Infinity;const bd={},bi={},act=new Set();
 for(const d in LOG){const ts=+new Date(d+'T00:00:00');first=Math.min(first,ts);if(ts<a||ts>b)continue;
  for(const id in LOG[d]){const [s,p]=LOG[d][id];tot+=s;songs+=p;bd[d]=(bd[d]||0)+s;if(s>0)act.add(d);const t=T.get(id);if(!t)continue;const o=bi[id]||(bi[id]={t,s:0,p:0});o.s+=s;o.p+=p}}
 /* streaks */
 const dayTotals={};for(const d in LOG){let s=0;for(const id in LOG[d])s+=LOG[d][id][0];if(s>0)dayTotals[d]=s}
 let cur=0,dd=new Date();if(!dayTotals[dkey(dd)])dd=new Date(+dd-DAY);while(dayTotals[dkey(dd)]){cur++;dd=new Date(+dd-DAY)}
 let best=0,run=0,prev=null;for(const d of Object.keys(dayTotals).sort()){const ts=+new Date(d+'T00:00:00');run=(prev!==null&&Math.round((ts-prev)/DAY)===1)?run+1:1;prev=ts;best=Math.max(best,run)}
 /* period header */
 const chips=[['today','Today'],['week','This week'],['month','This month'],['year','This year'],['all','All time'],['custom','Custom']].map(o=>`<button class="chip ${o[0]==period?'on':''}" data-act="per" data-p="${o[0]}">${o[1]}</button>`).join('');
 const head=`<h1 class="st-keep">Statistics</h1><div class="chips st-keep">${chips}</div>${period=='custom'?`<div class="bar st-keep"><label class="date-label">From <input type="date" id="d1" aria-label="Start date" value="${cust.a}"></label><label class="date-label">To <input type="date" id="d2" aria-label="End date" value="${cust.b}"></label></div>`:''}`;
 if(tot<=0&&!songs)return`<div class="st-page">${head}<div class="empty"><div class="art">♫</div><h3>No listening in this period</h3><p class="mu">Play a few songs and your listening time, top songs, artists and genres will appear here.</p><button class="btn" data-act="homeSearch" data-query="new music">Discover music</button></div></div>`;
 const ranked=Object.values(bi).sort((x,y)=>y.s-x.s);
 const topS=ranked.slice(0,5);LS.st=ranked.slice(0,20).map(x=>x.t);
 const group=(fn)=>{const m=new Map();for(const x of ranked){const k=fn(x.t);if(!k||UNK.test(String(k)))continue;let o=m.get(k);if(!o){o={name:k,s:0,p:0,rep:x};m.set(k,o)}o.s+=x.s;o.p+=x.p}return[...m.values()].sort((p,q)=>q.s-p.s)};
 const artists=group(t=>t.artist).slice(0,8),albums=group(t=>t.album).slice(0,8);
 LS.sta=artists.map(x=>x.rep.t);LS.stal=albums.map(x=>x.rep.t);
 /* previous period for the delta */
 let delta='';{const lbl={today:'yesterday',week:'last week',month:'last month',year:'last year'}[period];
  if(lbl){const span=period==='today'?DAY:Math.max(DAY,Math.ceil((now-a)/DAY)*DAY);let pv=0;for(const d in LOG){const ts=+new Date(d+'T00:00:00');if(ts>=a-span&&ts<a)for(const id in LOG[d])pv+=LOG[d][id][0]}
   if(pv>0){const pct=Math.round((tot-pv)/pv*100);delta=`<span class="st-delta ${pct>=0?'up':'down'}">${pct>=0?'▲':'▼'} ${Math.abs(pct)}% vs ${lbl}</span>`}}}
 const covers=ranked.slice(0,3).map(x=>art(x.t)).join('');
 const heroArt=ranked[0]&&artUrl(ranked[0].t.id)?`--st-art:url(${artUrl(ranked[0].t.id)})`:'';
 const topA=artists[0];
 const hero=`<section class="st-hero" style="${heroArt}"><div><span class="st-kick">You listened for</span><div class="st-big" data-cu="dur" data-v="${tot}">${fD(tot)}</div>${delta}<p>${topS[0]?`Top song <b>${H(topS[0].t.title)}</b>`:''}${topA?` · Top artist <b>${H(topA.name)}</b>`:''}</p>${topS[0]?`<button class="btn" data-act="play" data-id="${H(topS[0].t.id)}" data-l="st" data-i="0">Play your top songs</button>`:''}</div><div class="st-covers" aria-hidden="true">${covers}</div></section>`;
 /* kpis */
 const lo=Math.max(a,first===Infinity?now:first),hi=Math.min(b,now),spanDays=Math.max(1,Math.round((dayStart(hi)-dayStart(lo))/DAY)+1);
 const kpis=`<div class="st-kpis"><div class="st-card"><span class="st-kick">Songs played</span><span class="st-num" data-cu="int" data-v="${songs}">${songs.toLocaleString()}</span><small>${act.size} active day${act.size==1?'':'s'}</small></div><div class="st-card"><span class="st-kick">Streak</span><span class="st-num" data-cu="intd" data-v="${cur}">${cur} d</span><small>Best ${best} d</small></div><div class="st-card"><span class="st-kick">Daily average</span><span class="st-num">${fD(tot/spanDays)}</span><small>${act.size?fD(tot/act.size)+' on active days':'No listening yet'}</small></div></div>`;
 /* chart */
 const bk=buildBuckets(a,b,bd,first),mx=Math.max(1,...bk.items.map(x=>x.val)),bi_=bk.items.reduce((m,x,i,arr)=>x.val>arr[m].val?i:m,0),bestB=bk.items[bi_];
 const bestDayK=Object.keys(bd).sort((x,y)=>bd[y]-bd[x])[0];
 const cols=bk.items.map((x,i)=>`<button class="st-col${x.val?'':' zero'}${i===bi_&&x.val?' best':''}${x.today?' today':''}${x.future?' future':''}" data-tip="${H(x.tip)} · ${x.val?fD(x.val):'no listening'}" aria-label="${H(x.tip)}: ${x.val?fD(x.val):'no listening'}"><span class="st-bar" style="height:${Math.max(2,x.val/mx*100)}%;--bi:${i}"></span></button>`).join('');
 const dflt=bestB&&bestB.val?`Best: ${bestB.tip} · ${fD(bestB.val)}`:'';
 const chart=`<section class="st-card"><div class="st-head"><div><b>Listening time</b><br><small>${bk.sub}</small></div><div class="st-read" id="stRead" data-dflt="${H(dflt)}">${H(dflt)}</div></div><div class="st-chart" id="stChart">${cols}</div><div class="st-axis">${bk.items.map(x=>`<span>${H(x.label)}</span>`).join('')}</div><div class="st-ins">${bestDayK?`<span>Best day <b>${wd(+new Date(bestDayK+'T00:00:00'),{weekday:'short',day:'numeric',month:'short'})} · ${fD(bd[bestDayK])}</b></span>`:''}<span>Active days <b>${act.size} of ${spanDays}</b></span><span>Average song <b>${songs?fD(tot/songs):'—'}</b></span></div></section>`;
 /* top songs */
 const songRows=`<section class="st-card"><div class="st-head"><b>Top songs</b><small>by listening time</small></div><div class="st-list">${topS.map((x,i)=>`<div class="st-row" role="button" tabindex="0" data-act="play" data-id="${H(x.t.id)}" data-l="st" data-i="${i}" aria-label="Play ${H(x.t.title)}"><span class="st-rank">${i+1}</span>${art(x.t)}<div class="st-mid"><b>${H(x.t.title)}</b><small>${H(x.t.artist||'')}</small><div class="st-meter"><i style="width:${x.s/topS[0].s*100}%;--bi:${i}"></i></div></div><div class="st-val">${fD(x.s)}<small>${x.p}×</small></div></div>`).join('')}</div></section>`;
 const shelf=(title,sub,arr,l)=>arr.length?`<h2 class="home-section-title">${title}</h2><span class="st-sub">${sub}</span><div class="hs">${arr.map((x,i)=>`<div class="tile st-tile" role="button" tabindex="0" data-id="${H(x.rep.t.id)}" data-l="${l}" data-i="${i}" data-act="play" aria-label="Play ${H(x.name)}"><div class="art" style="${tint(x.rep.t)}">${lt(x.rep.t)}<span class="st-badge">${i+1}</span></div><b>${H(x.name)}</b><small>${fD(x.s)}</small></div>`).join('')}</div>`:'';
 /* genres donut */
 const gm={};for(const x of ranked){const g=x.t.genre;const k=!g||UNK.test(String(g))?'Unknown':g;gm[k]=(gm[k]||0)+x.s}
 let gl=Object.entries(gm).sort((p,q)=>q[1]-p[1]);const known=gl.filter(e=>e[0]!=='Unknown');if(known.length)gl=known;
 const gsum=gl.reduce((n,e)=>n+e[1],0)||1;let gTop=gl.slice(0,5);const rest=gl.slice(5).reduce((n,e)=>n+e[1],0);if(rest>0)gTop=[...gTop,['Other',rest]];
 let acc=0;const slices=gTop.map(([n,v],i)=>{const p=v/gsum*100,col=n==='Other'?'var(--mu)':PALETTE[i%PALETTE.length],len=Math.max(.6,p-(gTop.length>1?1.1:0)),o=`<circle class="st-slice" r="15.9155" cx="21" cy="21" stroke="${col}" stroke-dasharray="${len.toFixed(2)} ${(100-len).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" style="--bi:${i}"/>`;acc+=p;return o}).join('');
 const legend=gTop.map(([n,v],i)=>`<div><i style="background:${n==='Other'?'var(--mu)':PALETTE[i%PALETTE.length]}"></i><span>${H(n)}</span><em>${Math.round(v/gsum*100)}%</em></div>`).join('');
 const donut=gl.length&&!(gl.length===1&&gl[0][0]==='Unknown')?`<section class="st-card"><div class="st-head"><b>Genres</b><small>your sound in this period</small></div><div class="st-donut"><div class="st-dwrap"><svg viewBox="0 0 42 42" aria-hidden="true"><circle class="st-ring" r="15.9155" cx="21" cy="21"/>${slices}</svg><div class="st-dcenter"><b>${H(gTop[0][0])}</b><small>${Math.round(gTop[0][1]/gsum*100)}%</small></div></div><div class="st-legend">${legend}</div></div></section>`:'';
 /* skips and discoveries (library-wide) */
 const sk=[...T.values()].filter(t=>t.skips>0).sort((x,y)=>y.skips-x.skips).slice(0,5),disc=[...T.values()].filter(t=>t.plays>0&&!(t.ext&&t.ext.temp)).sort((x,y)=>y.added-x.added).slice(0,5);LS.sks=sk;LS.sdc=disc;
 const mini=(arr,l,val)=>arr.length?`<div class="st-list">${arr.map((t,i)=>`<div class="st-row" role="button" tabindex="0" data-act="play" data-id="${H(t.id)}" data-l="${l}" data-i="${i}" aria-label="Play ${H(t.title)}">${art(t)}<div class="st-mid"><b>${H(t.title)}</b><small>${H(t.artist||'')}</small></div><div class="st-val">${val(t)}</div></div>`).join('')}</div>`:`<p class="st-none">Nothing here yet.</p>`;
 const two=`<div class="st-two st-mini"><section class="st-card"><div class="st-head"><b>Most skipped</b><small>all time</small></div>${mini(sk,'sks',t=>t.skips+'×')}</section><section class="st-card"><div class="st-head"><b>Recently discovered</b><small>newest in your library</small></div>${mini(disc,'sdc',t=>new Date(t.added).toLocaleDateString(undefined,{day:'numeric',month:'short'}))}</section></div>`;
 return`<div class="st-page">${head}${hero}${kpis}${chart}${songRows}${shelf('Top artists','Tap to play their most played song',artists,'sta')}${shelf('Top albums','Tap to play the top track',albums,'stal')}${donut}${two}</div>`};
/* after render: count-up numbers + chart readout */
const rvn=renderViewNow;
renderViewNow=function(a){const r=rvn.apply(this,arguments);try{if(view==='stats')statsPost()}catch(e){}return r};
function statsPost(){
 const reduced=typeof reducedMotion==='function'&&reducedMotion(),lite=typeof LITE!=='undefined'&&LITE;
 if(!reduced&&!lite)document.querySelectorAll('#main [data-cu]').forEach(el=>{const v=+el.dataset.v,k=el.dataset.cu,f=k==='dur'?fD:k==='intd'?(n=>Math.round(n)+' d'):(n=>Math.round(n).toLocaleString());const t0=performance.now()+120;el.textContent=f(0);
  const step=now=>{const u=Math.max(0,Math.min(1,(now-t0)/900)),e=1-Math.pow(1-u,3);el.textContent=f(v*e);if(u<1)requestAnimationFrame(step);else el.textContent=f(v)};requestAnimationFrame(step)});
 const ch=document.getElementById('stChart'),rd=document.getElementById('stRead');
 if(ch&&rd){const set=e=>{const c=e.target.closest('.st-col');rd.textContent=c?c.dataset.tip:rd.dataset.dflt};ch.addEventListener('pointerover',set);ch.addEventListener('click',set);ch.addEventListener('pointerleave',()=>{rd.textContent=rd.dataset.dflt})}
}
}catch(e){console.error('v118 stats',e)}})();
</script>

<style id="xz-v119-morph-sheet">
/* ===== X.ZON v119: the player sheet is visible during open/close ===== */
/* v114 hid #plbg completely, so while the player closed there was nothing behind the flying cover and the player UI: the cover crossed Settings on its own and the text overlapped the page.
   During the morph only, #plbg is now an opaque, unblurred sheet in the player's own colour, so the page is never blurred or showing through mid-motion. At rest it stays hidden as before. */
html body.morphing #plbg{display:block!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border:0!important;
 background:color-mix(in srgb,#0b0a09 84%,var(--pc1,#0b0a09))!important}
html body.morphing #plbg::after{display:block!important;content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:radial-gradient(110% 80% at 15% 8%,color-mix(in srgb,var(--pc1,transparent) 62%,transparent),transparent 62%),radial-gradient(100% 80% at 92% 100%,color-mix(in srgb,var(--pc2,transparent) 55%,transparent),transparent 66%),linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.58))}
html:not(.xzd) body.morphing #plbg{background:color-mix(in srgb,#fbf7ef 86%,var(--pc1,#fbf7ef))!important}

 return `<h3 class="sec">Short songs</h3><p class="mu" style="font-size:12.5px;margin:0 0 8px">Hide anything this short from the library, search and playlists you browse. Songs with no length (like radio) always stay.</p><div class="chips">${[[0,'Show all'],[30,'30 s or less'],[45,'45 s or less'],[60,'60 s or less']].map(([v,l])=>chip('setminsec','v',v,m===v,l)).join('')}</div>
<h3 class="sec">Full songs from YouTube</h3><p class="mu" style="font-size:12.5px;margin:0 0 8px">Popular songs only come as 30-second previews from Apple and Deezer. With this on, they play in full through the YouTube player instead. YouTube plays in its own small player, so the equalizer and crossfade don’t apply to it.</p><div class="chips">${chip('setytauto','v','1',ytAuto(),'On')}${chip('setytauto','v','0',!ytAuto(),'Off')}</div>
${n?`<div class="row" role="button" tabindex="0" data-act="ytClear"><div class="rm"><b>Forget saved YouTube matches</b><small>${n} song${n===1?'':'s'} matched</small></div></div>`:''}`}
const FIELD='flex:1;min-width:0;padding:9px 11px;border-radius:10px;border:1px solid var(--ln);background:transparent;color:inherit;font:inherit';
function connBlock(){
 const yk=ytKey(),jid=(typeof JAM_CFG!=='undefined'&&JAM_CFG.clientId&&JAM_CFG.clientId!=='b869d1a9')?JAM_CFG.clientId:'';
 return `<h2 id="xz-conn" style="scroll-margin-top:84px">Connections &amp; keys</h2><p class="mu" style="font-size:12.5px;margin:0 0 8px">Your own free IDs and keys for online music. They stay on this device and are never included in backups or sync.</p>
<div class="card"><b>YouTube Data API key</b><p class="mu" id="yt-key-status" style="font-size:12.5px;margin:4px 0">${yk?'Saved on this device · ends …'+esc(yk.slice(-4)):'Not set · you can still paste a link for each song'}</p><small class="mu">Lets X.ZON find full songs by itself. Free, no card: console.cloud.google.com → new project → enable “YouTube Data API v3” → Credentials → API key.</small><div class="bar"><input id="yt-key-in" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="80" placeholder="YouTube API key (AIza…)" aria-label="YouTube API key" value="${esc(yk)}" style="${FIELD}"><button class="pill" data-act="ytKeySave">Save</button></div><div class="bar"><button class="pill" data-act="ytKeyTest">Test key</button>${yk?'<button class="pill" data-act="ytKeyClear">Remove</button>':''}</div><small class="mu" id="yt-key-msg" role="status" aria-live="polite"></small></div>
<div class="card"><b>Jamendo Client ID</b><p class="mu" style="font-size:12.5px;margin:4px 0">${jid?'Using your own ID · ends …'+esc(jid.slice(-3)):'Using the built-in ID'}</p><small class="mu">Optional: your own free Client ID (devportal.jamendo.com) if Jamendo shows an error in search. Leave empty to use the built-in one.</small><div class="bar"><input id="jamcid" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="32" placeholder="Jamendo Client ID" aria-label="Jamendo Client ID" value="${esc(jid)}" style="${FIELD}"><button class="pill" data-act="jamSave">Save</button></div></div>`}
{const _v=vSet;vSet=function(){let h=_v.apply(this,arguments);
 const re=/<h2>Music sources<\/h2><div class="card"><b>Jamendo<\/b>[\s\S]*?data-act="jamSave">Save<\/button><\/div><\/div>/;
 if(re.test(h))h=h.replace(re,()=>connBlock());else{const j=h.indexOf('<h2>Your data</h2>');h=j<0?h+connBlock():h.slice(0,j)+connBlock()+h.slice(j)}
 const k='<h3 class="sec">Default sort</h3>',i=h.indexOf(k);return i<0?h:h.slice(0,i)+settingsBlock()+h.slice(i)}}
const keyMsg=(t,bad)=>{const m=document.getElementById('yt-key-msg');if(m){m.textContent=t;m.style.color=bad?'#c0392b':''}};
ACT.ytKeySave=async()=>{
 const i=document.getElementById('yt-key-in'),v=String(i&&i.value||'').trim().replace(/^["']+|["']+$/g,'');
 if(v&&!/^[\w-]{20,80}$/.test(v)){keyMsg('That doesn’t look like a YouTube API key. Copy the whole key, with no spaces.',true);return}
 setYtKey(v);const st=document.getElementById('yt-key-status');
 if(!v){if(st)st.textContent='Not set · you can still paste a link for each song';keyMsg('');toast('YouTube key removed');return}
 if(st)st.textContent='Saved on this device · ends …'+v.slice(-4);keyMsg('Saved. Checking it…');
 const r=await testKey(v);keyMsg(r.ok?'Saved · key works.':'Saved, but: '+r.msg,!r.ok);toast(r.ok?'YouTube key saved':'Key saved, but YouTube rejected it');
 if(r.ok&&YP.active&&YP.track&&YP.state===-1)route(YP.track,true,{retry:true})};
ACT.ytKeyTest=async()=>{const i=document.getElementById('yt-key-in'),v=String(i&&i.value||'').trim()||ytKey();
 if(!v){keyMsg('Paste a key first.',true);return}keyMsg('Checking…');const r=await testKey(v);keyMsg(r.msg,!r.ok)};
ACT.ytKeyClear=()=>{setYtKey('');toast('YouTube key removed');try{R(true)}catch(e){}};
ACT.setminsec=e=>{ST.minSec=+e.dataset.v;svS();R(true);toast(ST.minSec>0?'Hiding songs of '+ST.minSec+' seconds or less':'Showing all songs')};
ACT.setytauto=e=>{ST.ytAuto=e.dataset.v==='1';svS();R(true);toast(ST.ytAuto?'Full songs through YouTube: on':'Full songs through YouTube: off');if(!ST.ytAuto&&YP.active)stop(false)};
ACT.ytClear=async()=>{const ok=await ask({title:'Forget saved matches?',msg:'X.ZON will look the songs up again next time.',ok:'Forget',danger:true});if(ok){lsSet('xzon.ytmap','{}');R(true);toast('Matches cleared')}};

window.__XZON_V133__={version:133,minSec:xzMinSec,yt:YP,parseYT};
})();
